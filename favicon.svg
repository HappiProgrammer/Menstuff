<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15202e" />
      <stop offset="100%" stop-color="#0b1118" />
    </linearGradient>

    <!-- Vibrant Mint & Sky Sonder Ribbon Gradient -->
    <linearGradient id="sonderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c795" />
      <stop offset="45%" stop-color="#25e2af" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00c795" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Inner Core Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25e2af" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00c795" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Ambient Glow Core -->
  <circle cx="32" cy="33" r="16" fill="url(#coreGlow)" />

  <!-- Intertwined Sonder Möbius Heart / Infinite Paths Emblem -->
  <path d="M32 49 C21 40 13 32 13 23 C13 16.5 18 12 24.5 12 C28.5 12 31.2 14 32 15.5 C32.8 14 35.5 12 39.5 12 C46 12 51 16.5 51 23 C51 32 43 40 32 49 Z" 
        fill="none" 
        stroke="url(#sonderGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Flowing Central Wave Loop (Symbolizing crossing paths) -->
  <path d="M21 27 C26 21 38 21 43 27 C46 31 43 37 36 37 C28 37 25 31 28 27 C31 23 38 23 41 27" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.95" />

  <!-- Radiant Center Star / Spark Node -->
  <circle cx="32" cy="27" r="2.2" fill="#ffffff" filter="url(#glow)" />
</svg>
